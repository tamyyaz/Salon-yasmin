<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#d98fa8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ياسمين">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>صالون ياسمين</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="splash" class="splash"><img src="/art/blossom.svg" alt=""></div>

<section id="login" class="login hidden">
  <div class="login-bg"></div>
  <img class="login-deco deco-tl" src="/art/garland.svg" alt="">
  <img class="login-deco deco-br" src="/art/garland.svg" alt="">
  <img class="login-fly fly1" src="/art/butterfly.svg" alt="">
  <img class="login-fly fly2" src="/art/butterfly.svg" alt="">
  <form id="loginForm" class="glass login-card" autocomplete="off">
    <div class="medallion"><img class="wiggle" src="/art/bouquet.svg" alt=""></div>
    <h1 class="brand brand-name">صالون ياسمين</h1>
    <p class="muted">منطقة خاصة بالصالون فقط</p>
    <label class="field">
      <span>كلمة السر</span>
      <input type="password" id="password" required autofocus autocomplete="current-password">
    </label>
    <p id="loginError" class="error" role="alert"></p>
    <button class="btn btn-primary btn-block" type="submit">دخول</button>
  </form>
</section>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="#/today">
        <span class="logo-flower"><img src="/art/blossom.svg" alt=""></span>
        <span class="brand brand-name">صالون ياسمين</span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/today" data-route="today">اليوم</a>
        <a href="#/appointments" data-route="appointments">المواعيد</a>
        <a href="#/clients" data-route="clients">الزبائن</a>
        <a href="#/services" data-route="services">الخدمات</a>
        <a href="#/notes" data-route="notes">الملاحظات</a>
      </nav>
      <div class="top-actions">
        <button class="btn btn-sm" data-walkin type="button">زبون مفاجئ</button>
        <button class="btn btn-primary btn-sm" data-new type="button">＋ حجز جديد</button>
      </div>
      <div class="utils">
        <button class="icon-btn util hidden" id="botBtn" type="button" aria-label="مساعد واتساب" title="مساعد واتساب">
          <span class="bot-dot"></span>
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a8 8 0 0 1-11.7 7.1L4 20l1.4-4.1A8 8 0 1 1 20 11.5z"/><path d="M9 9.5c.5 2.2 2.3 4 4.5 4.5l1-1.2-1.7-1-.8.6c-.7-.3-1.4-1-1.7-1.7l.6-.8-1-1.7z"/></svg>
        </button>
        <button class="icon-btn util" id="fxBtn" type="button" aria-label="مطر الزهور" title="مطر الزهور">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.2"/><path d="M12 9.8C10.5 7 10.5 4.2 12 3c1.5 1.2 1.5 4 0 6.8zM14.2 12c2.8-1.5 5.6-1.5 6.8 0-1.2 1.5-4 1.5-6.8 0zM12 14.2c1.5 2.8 1.5 5.6 0 6.8-1.5-1.2-1.5-4 0-6.8zM9.8 12C7 13.5 4.2 13.5 3 12c1.2-1.5 4-1.5 6.8 0z"/></svg>
        </button>
        <button class="icon-btn util" id="wakeBtn" type="button" aria-label="إبقاء الشاشة مفتوحة" title="إبقاء الشاشة مفتوحة">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
        </button>
        <button class="icon-btn util" id="logout" type="button" aria-label="خروج" title="خروج">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h11"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="view" class="container"></main>

  <div class="bottom-bar">
    <button class="btn" data-walkin type="button">زبون مفاجئ</button>
    <button class="btn btn-primary" data-new type="button">＋ حجز جديد</button>
  </div>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card glass" id="modalCard"></div>
</div>
<div id="ask" class="modal modal-top hidden" role="alertdialog" aria-modal="true">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card glass ask-card">
    <p id="askText"></p>
    <div class="modal-actions">
      <button class="btn" id="askNo" type="button">إلغاء</button>
      <button class="btn btn-primary" id="askYes" type="button">نعم</button>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>
<div id="offline" class="offline hidden" role="status">لا يوجد اتصال — يمكنك المتابعة، وستُحفظ التغييرات عند عودة الإنترنت</div>

<noscript>هذا الموقع يحتاج تفعيل JavaScript.</noscript>
<script src="/fx.js"></script>
<script src="/app.js"></script>
</body>
</html>
