name: Tests (Firebase emulators)

# Checks the Firestore security rules and the data layer against the local emulators.
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  emulator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run test:emu
