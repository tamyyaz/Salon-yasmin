name: Deploy to Firebase Hosting

# Every push to main builds the site and publishes it to https://<project-id>.web.app
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # security rules first, so the new pages never meet old rules (skipped when unchanged; needs the "Firebase Rules Admin" role)
      - name: Firestore rules
        continue-on-error: true
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/key.json"
          node scripts/deploy-rest.mjs --key "$RUNNER_TEMP/key.json" --rules-only
          rm -f "$RUNNER_TEMP/key.json"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live   # the project comes from .firebaserc
